<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#patients-content}, headerTitle='Patient Registry')}">
<body>
    <div id="patients-content">
        <!-- Dynamic Alert Banners -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4" role="alert" style="border-radius: 8px;">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4" role="alert" style="border-radius: 8px;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Search and Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4 p-3">
            <form th:action="@{/patients}" method="GET">
                <div class="row g-3 align-items-center">
                    <div class="col-md-3">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" name="search" th:value="${search}" placeholder="Search name, email, phone, ID..." class="form-control border-start-0 ps-0" style="border-radius: 0 8px 8px 0; outline: none; box-shadow: none;">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <select name="gender" class="form-select" style="border-radius: 8px;">
                            <option value="">All Genders</option>
                            <option value="Male" th:selected="${gender == 'Male'}">Male</option>
                            <option value="Female" th:selected="${gender == 'Female'}">Female</option>
                            <option value="Other" th:selected="${gender == 'Other'}">Other</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" name="regDate" th:value="${regDate}" class="form-control" style="border-radius: 8px;">
                    </div>
                    <div class="col-md-2">
                        <select name="ageGroup" class="form-select" style="border-radius: 8px;">
                            <option value="">All Ages</option>
                            <option value="0-17" th:selected="${ageGroup == '0-17'}">0-17 Years</option>
                            <option value="18-35" th:selected="${ageGroup == '18-35'}">18-35 Years</option>
                            <option value="36-50" th:selected="${ageGroup == '36-50'}">36-50 Years</option>
                            <option value="51-65" th:selected="${ageGroup == '51-65'}">51-65 Years</option>
                            <option value="66-150" th:selected="${ageGroup == '66-150'}">66+ Years</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2 justify-content-md-end">
                        <button type="submit" class="btn btn-primary px-3" style="border-radius: 8px;">Filter</button>
                        <a th:href="@{/patients}" class="btn btn-outline-secondary px-3" style="border-radius: 8px;">Clear</a>
                        <a th:href="@{/patients/add}" class="btn btn-success d-inline-flex align-items-center gap-1 px-3" style="border-radius: 8px;">
                            <i class="bi bi-person-plus-fill"></i> New
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="card border-0 shadow-sm p-0 overflow-hidden">
            <div class="px-4 py-3 border-bottom border-light bg-light d-flex align-items-center gap-2">
                <i class="bi bi-folder-fill text-primary"></i>
                <h4 class="mb-0 fs-6 fw-bold" style="text-transform: none; color: var(--medical-dark);">Patient Records</h4>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Patient Name</th>
                            <th>Email Address</th>
                            <th>Phone Number</th>
                            <th>Date of Birth</th>
                            <th>Gender</th>
                            <th class="text-end" style="width: 180px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="patient : ${patients}">
                            <td class="fw-semibold text-primary" th:text="${patient.id}">1</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="user-avatar-circle" style="width: 32px; height: 32px; font-size: 12px;" th:text="${#strings.substring(patient.fullName, 0, 1)}">P</div>
                                    <span class="fw-bold" th:text="${patient.fullName}">John Doe</span>
                                </div>
                            </td>
                            <td th:text="${patient.email}">john@example.com</td>
                            <td class="font-mono text-muted" th:text="${patient.phone}">+123456789</td>
                            <td th:text="${patient.dob}">1990-01-01</td>
                            <td>
                                <span class="gender-badge" th:text="${patient.gender}">Male</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-primary px-3 py-1" style="font-size: 12px; border-radius: 6px;">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    <a th:href="@{/patients/delete/{id}(id=${patient.id})}" 
                                       class="btn btn-sm btn-outline-danger px-3 py-1"
                                       style="font-size: 12px; border-radius: 6px;"
                                       onclick="return confirmDeletePatient();">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(patients)}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-people fs-1 text-muted mb-3 d-block"></i>
                                <p class="text-muted mb-0">No records found.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
