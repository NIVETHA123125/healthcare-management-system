<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Secure Password - CareGrid Healthcare</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    
    <style>
        /* Optional screen specific styling if needed */
    </style>
</head>
<body class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <a th:href="@{/}" class="auth-brand">
                <i class="bi-heart-pulse-fill"></i> CareGrid
            </a>
            <p class="auth-subtitle">New Password</p>
            <p class="small text-muted mt-2">Provide a secure new login password for: <br><strong class="text-primary font-mono small" th:text="${email}">name@example.com</strong></p>
        </div>

        <form th:action="@{/reset-password}" method="POST" class="needs-validation" id="resetForm" novalidate>
            <input type="hidden" name="email" th:value="${email}">
            <input type="hidden" name="dob" th:value="${dob}">

            <!-- Error Alert -->
            <div th:if="${error}" class="alert-custom alert-custom-danger">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${error}">Passwords do not match</span>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label-custom">New Password</label>
                <div class="input-group-custom">
                    <input type="password" id="password" name="password" class="form-control-custom" placeholder="••••••••" required autocomplete="new-password">
                    <i class="bi bi-lock input-icon"></i>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label for="confirmPassword" class="form-label-custom">Confirm New Password</label>
                <div class="input-group-custom">
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control-custom" placeholder="••••••••" required autocomplete="new-password">
                    <i class="bi bi-shield-lock input-icon"></i>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Reset Password</span>
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </button>
        </form>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Submit Spinner -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resetForm = document.getElementById('resetForm');
            const submitBtn = document.getElementById('submitBtn');

            if (resetForm && submitBtn) {
                resetForm.addEventListener('submit', function(event) {
                    if (resetForm.checkValidity()) {
                        submitBtn.classList.add('loading');
                        setTimeout(() => {
                            submitBtn.disabled = true;
                        }, 0);
                    }
                });
            }
        });
    </script>
</body>
</html>
