<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#patient-appointments-content}, headerTitle='My Appointments')}">
<body>
    <div id="patient-appointments-content">
        <!-- Dynamic Alert Banners -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4" role="alert" style="border-radius: 8px;">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4" role="alert" style="border-radius: 8px;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-calendar3-range text-primary fs-5"></i>
                    <h4 class="mb-0 fs-5 fw-bold" style="text-transform: none; color: var(--medical-dark);">My Consultations History</h4>
                </div>
                <a th:href="@{/patient/appointments/book}" class="btn btn-primary d-inline-flex align-items-center gap-2 px-4" style="border-radius: 8px;">
                    <i class="bi bi-calendar-plus"></i> Book Appointment Online
                </a>
            </div>
        </div>

        <!-- Search and Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4 p-3">
            <form th:action="@{/patient/appointments}" method="GET">
                <div class="row g-3 align-items-center">
                    <div class="col-md-3">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" name="search" th:value="${search}" placeholder="Search doctor name, ID..." class="form-control border-start-0 ps-0" style="border-radius: 0 8px 8px 0; outline: none; box-shadow: none;">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <select name="status" class="form-select" style="border-radius: 8px;">
                            <option value="">All Statuses</option>
                            <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
                            <option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
                            <option value="COMPLETED" th:selected="${status == 'COMPLETED'}">Completed</option>
                            <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Cancelled</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" name="date" th:value="${date}" class="form-control" style="border-radius: 8px;">
                    </div>
                    <div class="col-md-3">
                        <select name="timeRange" class="form-select" style="border-radius: 8px;">
                            <option value="">All Dates</option>
                            <option value="upcoming" th:selected="${timeRange == 'upcoming'}">Upcoming Appointments</option>
                            <option value="past" th:selected="${timeRange == 'past'}">Past Appointments</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2 justify-content-md-end">
                        <button type="submit" class="btn btn-primary px-3" style="border-radius: 8px;">Filter</button>
                        <a th:href="@{/patient/appointments}" class="btn btn-outline-secondary px-3" style="border-radius: 8px;">Clear</a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="card border-0 shadow-sm p-0 overflow-hidden">
            <div class="px-4 py-3 border-bottom border-light bg-light d-flex align-items-center gap-2">
                <i class="bi bi-file-medical text-primary"></i>
                <span class="text-uppercase fw-bold fs-7 text-muted tracking-wider">Booked Consultations</span>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Doctor Name</th>
                            <th>Specialization</th>
                            <th>Reason / Symptoms</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="appt : ${appointments}">
                            <td class="fw-bold text-dark" th:text="${#temporals.format(appt.appointmentDate, 'yyyy-MM-dd hh:mm a')}">2026-06-25 10:00 AM</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="user-avatar-circle" style="width: 28px; height: 28px; font-size: 11px;" th:text="${#strings.substring(appt.doctor.fullName, 0, 1)}">D</div>
                                    <span class="fw-bold" th:text="${'Dr. ' + appt.doctor.fullName}">Dr. Shankar R</span>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-info-subtle text-info border border-info-subtle px-2 py-1 rounded-pill" th:text="${appt.doctor.specialization}">Pediatrics</span>
                            </td>
                            <td th:text="${appt.notes}">Health Checkup</td>
                            <td>
                                <span class="status-pill" 
                                      th:classappend="${appt.status == 'PENDING' ? 'status-pill-pending' : (appt.status == 'APPROVED' ? 'status-pill-approved' : (appt.status == 'COMPLETED' ? 'status-pill-completed' : 'status-pill-cancelled'))}" 
                                      th:text="${appt.status}">PENDING</span>
                            </td>
                            <td>
                                <a th:if="${appt.status == 'PENDING' || appt.status == 'APPROVED'}" 
                                   th:href="@{/patient/appointments/cancel/{id}(id=${appt.id})}" 
                                   class="btn btn-sm btn-outline-danger px-3 py-1 fw-semibold" 
                                   style="font-size: 12px; border-radius: 6px;"
                                   onclick="return confirm('Are you sure you want to cancel this appointment?');">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                                <span th:if="${appt.status == 'COMPLETED' || appt.status == 'CANCELLED'}" class="text-muted small">-</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(appointments)}">
                            <td colspan="6" class="text-center py-5">
                                <i class="bi bi-calendar-x fs-1 text-muted mb-3 d-block"></i>
                                <p class="text-muted mb-0">No records found.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
