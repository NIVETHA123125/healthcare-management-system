<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#patient-appointments-content}, headerTitle='My Appointments')}">
<body>
    <div id="patient-appointments-content">
        <!-- Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-calendar3-range text-primary fs-5"></i>
                    <h4 class="mb-0 fs-5 fw-bold" style="text-transform: none; color: var(--medical-dark);">My Consultations History</h4>
                </div>
                <a th:href="@{/patient/appointments/book}" class="btn btn-primary d-inline-flex align-items-center gap-2 px-4" style="border-radius: 8px;">
                    <i class="bi bi-calendar-plus"></i> Book Appointment Online
                </a>
            </div>
        </div>

        <!-- Table Card -->
        <div class="card border-0 shadow-sm p-0 overflow-hidden">
            <div class="px-4 py-3 border-bottom border-light bg-light d-flex align-items-center gap-2">
                <i class="bi bi-file-medical text-primary"></i>
                <span class="text-uppercase fw-bold fs-7 text-muted tracking-wider">Booked Consultations</span>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Date & Time</th>
                            <th>Doctor Name</th>
                            <th>Specialization</th>
                            <th>Reason / Symptoms</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="appt : ${appointments}">
                            <td class="fw-semibold text-primary" th:text="${appt.id}">1</td>
                            <td class="fw-bold text-dark" th:text="${#temporals.format(appt.appointmentDate, 'yyyy-MM-dd hh:mm a')}">2026-06-25 10:00 AM</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="user-avatar-circle" style="width: 28px; height: 28px; font-size: 11px;" th:text="${#strings.substring(appt.doctor.fullName, 0, 1)}">D</div>
                                    <span class="fw-bold" th:text="${'Dr. ' + appt.doctor.fullName}">Dr. Shankar R</span>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-info-subtle text-info border border-info-subtle px-2 py-1 rounded-pill" th:text="${appt.doctor.specialization}">Pediatrics</span>
                            </td>
                            <td th:text="${appt.notes}">Health Checkup</td>
                            <td>
                                <span class="status-pill" 
                                      th:classappend="${appt.status == 'SCHEDULED' ? 'status-pill-scheduled' : (appt.status == 'COMPLETED' ? 'status-pill-completed' : 'status-pill-cancelled')}" 
                                      th:text="${appt.status}">SCHEDULED</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(appointments)}">
                            <td colspan="6" class="text-center py-5">
                                <i class="bi bi-calendar-x fs-1 text-muted mb-3 d-block"></i>
                                <p class="text-muted mb-0">You have no appointments booked yet. Click "Book Appointment Online" to schedule one.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
