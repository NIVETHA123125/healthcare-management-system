<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#doctor-patients-content}, headerTitle='My Patients')}">
<body>
    <div id="doctor-patients-content">
        <!-- Title Banner -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-people-fill text-primary fs-5"></i>
                <h4 class="mb-0 fs-5 fw-bold" style="text-transform: none; color: var(--medical-dark);">My Patients Directory</h4>
            </div>
        </div>

        <!-- Search and Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4 p-3">
            <form th:action="@{/doctor/patients}" method="GET">
                <div class="row g-3 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" name="search" th:value="${search}" placeholder="Search patient name, email, phone..." class="form-control border-start-0 ps-0" style="border-radius: 0 8px 8px 0; outline: none; box-shadow: none;">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select name="gender" class="form-select" style="border-radius: 8px;">
                            <option value="">All Genders</option>
                            <option value="Male" th:selected="${gender == 'Male'}">Male</option>
                            <option value="Female" th:selected="${gender == 'Female'}">Female</option>
                            <option value="Other" th:selected="${gender == 'Other'}">Other</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2 justify-content-md-end">
                        <button type="submit" class="btn btn-primary px-3" style="border-radius: 8px;">Filter</button>
                        <a th:href="@{/doctor/patients}" class="btn btn-outline-secondary px-3" style="border-radius: 8px;">Clear</a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Patients Directory Grid/Table -->
        <div class="card border-0 shadow-sm p-0 overflow-hidden">
            <div class="px-4 py-3 border-bottom border-light bg-light d-flex align-items-center gap-2">
                <i class="bi bi-person-lines-fill text-primary"></i>
                <span class="text-uppercase fw-bold fs-7 text-muted tracking-wider">Patient Records Registry</span>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Date of Birth / Age</th>
                            <th>Gender</th>
                            <th>Phone Number</th>
                            <th>Email Address</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="patient : ${patients}">
                            <td class="font-mono fw-bold text-primary" th:text="${'#PT-' + patient.id}">#PT-1</td>
                            <td class="fw-bold" th:text="${patient.fullName}">Patient Name</td>
                            <td class="font-mono" th:text="${patient.dob}">1990-01-01</td>
                            <td>
                                <span class="badge bg-secondary-subtle text-secondary px-2 py-1" th:text="${patient.gender}">Male</span>
                            </td>
                            <td th:text="${patient.phone}">9876543210</td>
                            <td th:text="${patient.email}">patient@caregrid.com</td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/doctor/patients/records/{id}(id=${patient.id})}" class="btn btn-sm btn-primary py-1 px-3 fw-semibold" style="font-size: 13px; border-radius: 6px;">
                                        <i class="bi bi-folder2-open me-1"></i> Open Records
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(patients)}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-people fs-1 text-muted mb-3 d-block"></i>
                                <p class="text-muted mb-0">No records found.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
