<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#doctors-content}, headerTitle='Doctor Directory')}">
<body>
    <div id="doctors-content">
        <!-- Search and Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-8">
                    <form th:action="@{/doctors}" method="GET" class="d-flex gap-2">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search doctors by name or specialization..." class="form-control border-start-0 ps-0" style="border-radius: 0 8px 8px 0; outline: none; box-shadow: none;">
                        </div>
                        <button type="submit" class="btn btn-outline-primary px-4" style="border-radius: 8px;">Search</button>
                        <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/doctors}" class="btn btn-outline-danger px-3 d-flex align-items-center justify-content-center" style="border-radius: 8px;" title="Clear Search">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </form>
                </div>
                <div class="col-md-4 text-md-end">
                    <a th:href="@{/doctors/add}" class="btn btn-primary d-inline-flex align-items-center gap-2 px-4" style="border-radius: 8px;">
                        <i class="bi bi-person-plus-fill"></i> Register Doctor
                    </a>
                </div>
            </div>
        </div>

        <!-- Table Card -->
        <div class="card border-0 shadow-sm p-0 overflow-hidden">
            <div class="px-4 py-3 border-bottom border-light bg-light d-flex align-items-center gap-2">
                <i class="bi bi-person-badge-fill text-primary"></i>
                <h4 class="mb-0 fs-6 fw-bold" style="text-transform: none; color: var(--medical-dark);">Clinical Practitioners</h4>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Practitioner Name</th>
                            <th>Specialization</th>
                            <th>Email Address</th>
                            <th>Phone Number</th>
                            <th>Availability Hours</th>
                            <th class="text-end" style="width: 180px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="doctor : ${doctors}">
                            <td class="fw-semibold text-primary" th:text="${doctor.id}">1</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="user-avatar-circle" style="width: 32px; height: 32px; font-size: 12px;" th:text="${#strings.substring(doctor.fullName, 0, 1)}">D</div>
                                    <span class="fw-bold" th:text="${'Dr. ' + doctor.fullName}">Dr. Gregory House</span>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-info-subtle text-info border border-info-subtle px-2 py-1 rounded-pill" th:text="${doctor.specialization}">Cardiology</span>
                            </td>
                            <td th:text="${doctor.email}">g.house@caregrid.com</td>
                            <td class="font-mono text-muted" th:text="${doctor.phone}">+1 (555) 100-2000</td>
                            <td class="text-muted small" th:text="${doctor.availabilityHours}">09:00 AM - 05:00 PM</td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-sm btn-outline-primary px-3 py-1" style="font-size: 12px; border-radius: 6px;">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    <a th:href="@{/doctors/delete/{id}(id=${doctor.id})}" 
                                       class="btn btn-sm btn-outline-danger px-3 py-1"
                                       style="font-size: 12px; border-radius: 6px;"
                                       onclick="return confirmDeleteDoctor();">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(doctors)}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-heart-pulse fs-1 text-muted mb-3 d-block"></i>
                                <p class="text-muted mb-0">No doctors found. Click "Register Doctor" to add one.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
