<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#consultation-edit-content}, headerTitle='Edit Medical Assessment')}">
<body>
    <div id="consultation-edit-content">
        <div class="card border-0 shadow-sm max-width-800 mx-auto" style="max-width: 850px;">
            <div class="d-flex align-items-center gap-2 border-bottom border-light pb-3 mb-4">
                <i class="bi bi-pencil-square text-primary fs-4"></i>
                <h3 class="mb-0 fs-5 fw-bold" style="text-transform: none; color: var(--medical-dark);">Update Clinical Assessment</h3>
            </div>
            
            <!-- Patient Metadata Summary Card -->
            <div class="p-3 mb-4 rounded border border-primary-subtle bg-primary-subtle bg-opacity-10">
                <span class="text-primary text-uppercase fw-bold fs-7 tracking-wider d-block mb-2">Patient Metadata</span>
                <h4 class="fw-bold mb-3" style="text-transform: none; color: var(--medical-dark);" th:text="${consultation.patient.fullName}">Patient Name</h4>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <span class="text-muted small d-block">Age / DOB</span>
                        <span class="fw-semibold font-mono" th:text="${consultation.patient.dob}">1990-01-01</span>
                    </div>
                    <div class="col-sm-6">
                        <span class="text-muted small d-block">Gender</span>
                        <span class="fw-semibold" th:text="${consultation.patient.gender}">Male</span>
                    </div>
                </div>
            </div>

            <form th:action="@{/consultations/update}" th:object="${consultation}" method="POST" class="needs-validation" novalidate>
                <input type="hidden" th:field="*{id}">
                
                <!-- Section 1: Basic Information -->
                <div class="mb-4">
                    <h5 class="fw-bold text-dark border-bottom pb-2 mb-3" style="text-transform: none;"><i class="bi bi-activity text-success me-1"></i> Basic Vitals</h5>
                    <div class="row g-3">
                        <div class="col-sm-3">
                            <label for="height" class="form-label fw-semibold text-muted small">Height (cm)</label>
                            <input type="text" id="height" th:field="*{height}" class="form-control" placeholder="e.g. 175" style="border-radius: 6px;">
                        </div>
                        <div class="col-sm-3">
                            <label for="weight" class="form-label fw-semibold text-muted small">Weight (kg)</label>
                            <input type="text" id="weight" th:field="*{weight}" class="form-control" placeholder="e.g. 70" style="border-radius: 6px;">
                        </div>
                        <div class="col-sm-3">
                            <label for="bloodGroup" class="form-label fw-semibold text-muted small">Blood Group</label>
                            <select id="bloodGroup" th:field="*{bloodGroup}" class="form-select" style="border-radius: 6px;">
                                <option value="">Select Group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </div>
                        <div class="col-sm-3">
                            <label for="bloodPressure" class="form-label fw-semibold text-muted small">Blood Pressure</label>
                            <input type="text" id="bloodPressure" th:field="*{bloodPressure}" class="form-control" placeholder="e.g. 120/80" style="border-radius: 6px;">
                        </div>
                    </div>
                </div>

                <!-- Section 2: Patient Medical History -->
                <div class="mb-4">
                    <h5 class="fw-bold text-dark border-bottom pb-2 mb-3" style="text-transform: none;"><i class="bi bi-journal-medical text-primary me-1"></i> Patient Medical History</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="chiefComplaint" class="form-label fw-semibold text-muted small">Chief Complaint</label>
                            <textarea id="chiefComplaint" th:field="*{chiefComplaint}" class="form-control" rows="2" placeholder="Primary reason for consulting..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="currentSymptoms" class="form-label fw-semibold text-muted small">Current Symptoms</label>
                            <textarea id="currentSymptoms" th:field="*{currentSymptoms}" class="form-control" rows="2" placeholder="List present symptoms..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="previousDiseases" class="form-label fw-semibold text-muted small">Previous Diseases</label>
                            <textarea id="previousDiseases" th:field="*{previousDiseases}" class="form-control" rows="2" placeholder="Past medical conditions/diagnoses..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="allergies" class="form-label fw-semibold text-muted small">Allergies</label>
                            <textarea id="allergies" th:field="*{allergies}" class="form-control" rows="2" placeholder="Drug, food, or chemical allergies..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="currentMedications" class="form-label fw-semibold text-muted small">Current Medications</label>
                            <textarea id="currentMedications" th:field="*{currentMedications}" class="form-control" rows="2" placeholder="Any currently active medications..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="previousMedications" class="form-label fw-semibold text-muted small">Previous Medications</label>
                            <textarea id="previousMedications" th:field="*{previousMedications}" class="form-control" rows="2" placeholder="Past medications on record..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="surgeries" class="form-label fw-semibold text-muted small">Past Surgeries</label>
                            <textarea id="surgeries" th:field="*{surgeries}" class="form-control" rows="2" placeholder="Surgical procedures done..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label for="familyMedicalHistory" class="form-label fw-semibold text-muted small">Family Medical History</label>
                            <textarea id="familyMedicalHistory" th:field="*{familyMedicalHistory}" class="form-control" rows="2" placeholder="Genetic/hereditary diseases..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label for="lifestyleInfo" class="form-label fw-semibold text-muted small">Lifestyle Information</label>
                            <textarea id="lifestyleInfo" th:field="*{lifestyleInfo}" class="form-control" rows="2" placeholder="Smoking, alcohol, diet, exercise..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Consultation Notes -->
                <div class="mb-4">
                    <h5 class="fw-bold text-dark border-bottom pb-2 mb-3" style="text-transform: none;"><i class="bi bi-file-earmark-text text-secondary me-1"></i> Assessment Notes</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="diagnosis" class="form-label fw-semibold text-muted small">Medical Diagnosis *</label>
                            <textarea id="diagnosis" th:field="*{diagnosis}" class="form-control" rows="2" placeholder="Enter clinical diagnosis..." required style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="treatmentPlan" class="form-label fw-semibold text-muted small">Treatment Plan</label>
                            <textarea id="treatmentPlan" th:field="*{treatmentPlan}" class="form-control" rows="2" placeholder="Recommended treatment roadmap..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="notes" class="form-label fw-semibold text-muted small">Physician Clinical Notes</label>
                            <textarea id="notes" th:field="*{notes}" class="form-control" rows="2" placeholder="Internal physician checkup details..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="followUpInstructions" class="form-label fw-semibold text-muted small">Follow-up Instructions</label>
                            <textarea id="followUpInstructions" th:field="*{followUpInstructions}" class="form-control" rows="2" placeholder="Special instructions for follow-ups..." style="resize: none; border-radius: 6px;"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Section 4: Prescription Section -->
                <div class="mb-4">
                    <h5 class="fw-bold text-dark border-bottom pb-2 mb-3" style="text-transform: none;"><i class="bi bi-capsule text-danger me-1"></i> Rx Prescription Form</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="medicineName" class="form-label fw-semibold text-muted small">Medicine / Drug Name</label>
                            <input type="text" id="medicineName" th:field="*{medicineName}" class="form-control" placeholder="e.g. Paracetamol 500mg" style="border-radius: 6px;">
                        </div>
                        <div class="col-md-2">
                            <label for="dosage" class="form-label fw-semibold text-muted small">Dosage</label>
                            <input type="text" id="dosage" th:field="*{dosage}" class="form-control" placeholder="e.g. 1 Tablet" style="border-radius: 6px;">
                        </div>
                        <div class="col-md-3">
                            <label for="frequency" class="form-label fw-semibold text-muted small">Frequency</label>
                            <input type="text" id="frequency" th:field="*{frequency}" class="form-control" placeholder="e.g. 3x daily (1-0-1)" style="border-radius: 6px;">
                        </div>
                        <div class="col-md-3">
                            <label for="duration" class="form-label fw-semibold text-muted small">Duration</label>
                            <input type="text" id="duration" th:field="*{duration}" class="form-control" placeholder="e.g. 5 Days" style="border-radius: 6px;">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="additionalInstructions" class="form-label fw-semibold text-muted small">Special Intake Instructions</label>
                        <textarea id="additionalInstructions" th:field="*{additionalInstructions}" class="form-control" rows="2" placeholder="e.g. Take with warm water, after food..." style="resize: none; border-radius: 6px;"></textarea>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-2 pt-3 border-top border-light">
                    <button type="submit" class="btn btn-primary px-4 py-2" style="border-radius: 8px;">Update Medical Record</button>
                    <a th:href="@{/doctor/patients/records/{id}(id=${consultation.patient.id})}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 8px;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
