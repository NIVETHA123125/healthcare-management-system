<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#notifications-content}, headerTitle='Notifications History')}">
<body>
    <div id="notifications-content">
        <div class="card border-0 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Your Notifications</h4>
                <div class="d-flex gap-2" th:if="${!#lists.isEmpty(notifications)}">
                    <button class="btn btn-outline-primary btn-sm fw-semibold" id="markAllReadBtn" onclick="markAllNotificationsRead()" style="border-radius: 6px;">
                        <i class="bi bi-check-all me-1"></i> Mark All as Read
                    </button>
                    <button class="btn btn-outline-danger btn-sm fw-semibold" id="clearAllBtn" onclick="clearAllNotifications()" style="border-radius: 6px;">
                        <i class="bi bi-trash-fill me-1"></i> Clear All
                    </button>
                </div>
            </div>

            <!-- Filter Tabs -->
            <ul class="nav nav-tabs mb-4" id="notificationTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-semibold" id="all-tab" data-bs-toggle="tab" type="button" onclick="filterNotifications('all')">All</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-semibold" id="unread-tab" data-bs-toggle="tab" type="button" onclick="filterNotifications('unread')">Unread</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-semibold" id="read-tab" data-bs-toggle="tab" type="button" onclick="filterNotifications('read')">Read</button>
                </li>
            </ul>

            <div class="list-group list-group-flush" id="notificationsListGroup">
                <div th:each="n : ${notifications}" class="list-group-item py-3 px-0 border-light-subtle d-flex align-items-start gap-3 position-relative notification-item-row" th:id="${'notification-row-' + n.id}" th:classappend="${n.read ? 'opacity-75' : ''}" th:data-read="${n.read}">
                    <!-- Icon based on type -->
                    <div class="rounded-circle p-2 d-flex align-items-center justify-content-center" th:classappend="${
                        n.type == 'APPOINTMENT' ? 'bg-primary-subtle text-primary' :
                        n.type == 'PRESCRIPTION' ? 'bg-success-subtle text-success' :
                        n.type == 'ACCOUNT' ? 'bg-info-subtle text-info' :
                        n.type == 'MEDICAL' ? 'bg-warning-subtle text-warning' :
                        'bg-danger-subtle text-danger'
                    }" style="width: 42px; height: 42px; flex-shrink: 0;">
                        <i class="bi fs-5" th:classappend="${
                            n.type == 'APPOINTMENT' ? 'bi-calendar-check-fill' :
                            n.type == 'PRESCRIPTION' ? 'bi-capsule-fill' :
                            n.type == 'ACCOUNT' ? 'bi-person-fill-lock' :
                            n.type == 'MEDICAL' ? 'bi-file-earmark-medical-fill' :
                            'bi-exclamation-triangle-fill'
                        }"></i>
                    </div>

                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="fw-bold mb-1" th:text="${n.title}">Notification Title</h6>
                            <span class="text-muted small" th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd hh:mm a')}">Date</span>
                        </div>
                        <p class="text-muted mb-2 text-wrap" th:text="${n.message}" style="max-width: 90%;">Message body goes here.</p>
                        
                        <div class="d-flex gap-2 align-items-center">
                            <span class="badge" th:classappend="${n.read ? 'bg-secondary-subtle text-secondary' : 'bg-primary-subtle text-primary'}" th:text="${n.read ? 'Read' : 'New'}">New</span>
                            <button th:if="${!n.read}" class="btn btn-link btn-sm p-0 text-decoration-none fw-semibold" th:onclick="'markNotificationRead(' + ${n.id} + ')'" style="font-size: 12.5px;">Mark as Read</button>
                            <button class="btn btn-link btn-sm p-0 text-decoration-none text-danger fw-semibold ms-2" th:onclick="'deleteNotification(' + ${n.id} + ')'" style="font-size: 12.5px;">Delete</button>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                    <i class="bi bi-bell-slash fs-1 text-muted mb-3 d-block"></i>
                    <p class="text-muted mb-0">You have no notifications yet.</p>
                </div>
                
                <div id="noFilteredResultsMessage" class="text-center py-5 d-none">
                    <i class="bi bi-bell-slash fs-1 text-muted mb-3 d-block"></i>
                    <p class="text-muted mb-0">No notifications in this tab.</p>
                </div>
            </div>
        </div>

        <!-- Inline Javascript for notification actions -->
        <script>
            function filterNotifications(filterType) {
                const rows = document.querySelectorAll('.notification-item-row');
                let visibleCount = 0;
                
                rows.forEach(row => {
                    const isRead = row.getAttribute('data-read') === 'true';
                    if (filterType === 'all') {
                        row.classList.remove('d-none');
                        visibleCount++;
                    } else if (filterType === 'unread') {
                        if (!isRead) {
                            row.classList.remove('d-none');
                            visibleCount++;
                        } else {
                            row.classList.add('d-none');
                        }
                    } else if (filterType === 'read') {
                        if (isRead) {
                            row.classList.remove('d-none');
                            visibleCount++;
                        } else {
                            row.classList.add('d-none');
                        }
                    }
                });

                const emptyMessage = document.getElementById('noFilteredResultsMessage');
                if (visibleCount === 0 && rows.length > 0) {
                    emptyMessage.classList.remove('d-none');
                } else {
                    emptyMessage.classList.add('d-none');
                }
            }

            function markNotificationRead(id) {
                fetch('/api/notifications/mark-read/' + id, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }

            function markAllNotificationsRead() {
                fetch('/api/notifications/mark-all-read', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            window.location.reload();
                        }
                    });
            }

            function deleteNotification(id) {
                if (confirm("Are you sure you want to delete this notification?")) {
                    fetch('/api/notifications/delete/' + id, { method: 'POST' })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                const row = document.getElementById('notification-row-' + id);
                                if (row) {
                                    row.remove();
                                }
                                // If list is empty, reload to show empty state
                                const list = document.getElementById('notificationsListGroup');
                                const rows = document.querySelectorAll('.notification-item-row');
                                if (rows.length === 0) {
                                    window.location.reload();
                                }
                            }
                        });
                }
            }

            function clearAllNotifications() {
                if (confirm("Are you sure you want to delete all your notifications? This action cannot be undone.")) {
                    fetch('/api/notifications/clear-all', { method: 'POST' })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                window.location.reload();
                            }
                        });
                }
            }
        </script>
    </div>
</body>
</html>
    </div>
</body>
</html>
