<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#patient-prescriptions-content}, headerTitle='My Prescriptions')}">
<body>
    <div id="patient-prescriptions-content">
        <!-- Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-capsule text-primary fs-5"></i>
                <h4 class="mb-0 fs-5 fw-bold" style="text-transform: none; color: var(--medical-dark);">My Prescribed Medications</h4>
            </div>
        </div>

        <!-- Search and Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4 p-3">
            <form th:action="@{/patient/prescriptions}" method="GET">
                <div class="row g-3 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" name="search" th:value="${search}" placeholder="Search doctor name, medication, ID..." class="form-control border-start-0 ps-0" style="border-radius: 0 8px 8px 0; outline: none; box-shadow: none;">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <input type="date" name="date" th:value="${date}" class="form-control" style="border-radius: 8px;">
                    </div>
                    <div class="col-md-3 d-flex gap-2 justify-content-md-end">
                        <button type="submit" class="btn btn-primary px-3" style="border-radius: 8px;">Filter</button>
                        <a th:href="@{/patient/prescriptions}" class="btn btn-outline-secondary px-3" style="border-radius: 8px;">Clear</a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="card border-0 shadow-sm p-0 overflow-hidden">
            <div class="px-4 py-3 border-bottom border-light bg-light d-flex align-items-center gap-2">
                <i class="bi bi-file-medical text-primary"></i>
                <span class="text-uppercase fw-bold fs-7 text-muted tracking-wider">Active Prescriptions</span>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Date</th>
                            <th>Doctor Name</th>
                            <th>Medication / Medicine</th>
                            <th>Dosage Instructions</th>
                            <th>Duration</th>
                            <th>Special Instructions</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prescription : ${prescriptions}">
                            <td class="fw-semibold text-primary" th:text="${prescription.id}">1</td>
                            <td class="fw-bold text-dark" th:text="${prescription.prescribedDate}">2026-06-30</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="user-avatar-circle" style="width: 28px; height: 28px; font-size: 11px;" th:text="${#strings.substring(prescription.doctor.fullName, 0, 1)}">D</div>
                                    <span class="fw-bold" th:text="${'Dr. ' + prescription.doctor.fullName}">Dr. Shankar R</span>
                                </div>
                            </td>
                            <td class="fw-bold text-success" th:text="${prescription.medication}">Paracetamol 500mg</td>
                            <td th:text="${prescription.dosage}">1-0-1 after food</td>
                            <td>
                                <span class="badge bg-info-subtle text-info border border-info-subtle px-2 py-1 rounded-pill" th:text="${prescription.duration}">5 Days</span>
                            </td>
                            <td th:text="${prescription.instructions}">Take with warm water</td>
                            <td>
                                <a th:href="@{/patient/prescriptions/print/{id}(id=${prescription.id})}" target="_blank" class="btn btn-sm btn-outline-primary py-1 px-2 fw-semibold" style="font-size: 12.5px; border-radius: 6px;">
                                    <i class="bi bi-printer me-1"></i> Print / Save
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(prescriptions)}">
                            <td colspan="8" class="text-center py-5">
                                <i class="bi bi-capsule-ext-boundary fs-1 text-muted mb-3 d-block"></i>
                                <p class="text-muted mb-0">No records found.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
