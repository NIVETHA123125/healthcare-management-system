<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareGrid Healthcare</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    
    <style>
        /* Optional screen specific styling if needed */
    </style>
</head>
<body class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <a th:href="@{/}" class="auth-brand">
                <i class="bi-heart-pulse-fill"></i> CareGrid
            </a>
            <p class="auth-subtitle">Sign in to your portal dashboard</p>
        </div>

        <form th:action="@{/login}" method="POST" class="needs-validation" id="loginForm" novalidate>
            <!-- Error Alert -->
            <div th:if="${error}" class="alert-custom alert-custom-danger">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${error}">Invalid credentials</span>
            </div>

            <!-- Success Alert -->
            <div th:if="${successMessage}" class="alert-custom alert-custom-success">
                <i class="bi bi-check-circle-fill fs-5"></i>
                <span th:text="${successMessage}">Registration successful</span>
            </div>

            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label-custom">Username or Email</label>
                <div class="input-group-custom">
                    <input type="text" id="username" name="username" class="form-control-custom" placeholder="e.g. admin or patient@caregrid.com" required autocomplete="username">
                    <i class="bi bi-person input-icon"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label-custom">Password</label>
                <div class="input-group-custom">
                    <input type="password" id="password" name="password" class="form-control-custom" placeholder="••••••••" required autocomplete="current-password">
                    <i class="bi bi-lock input-icon"></i>
                    <button type="button" class="password-toggle" id="togglePasswordBtn" aria-label="Toggle Password Visibility">
                        <i class="bi bi-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me and Forgot Password -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                    <label class="form-check-label text-dark" for="remember-me" style="font-size: 13.5px; cursor: pointer;">
                        Remember me
                    </label>
                </div>
                <a th:href="@{/forgot-password}" class="small text-decoration-none" style="font-size: 13.5px;">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Sign In</span>
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </button>
        </form>

        <!-- Registration -->
        <div class="text-center mt-4 small text-muted">
            New to CareGrid? <a th:href="@{/register}" class="fw-semibold">Register Patient</a>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Password Visibility Toggle Script & Submit Spinner -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const passwordInput = document.getElementById('password');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');
            
            if (togglePasswordBtn && passwordInput && togglePasswordIcon) {
                togglePasswordBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    togglePasswordIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
                });
            }

            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');

            if (loginForm && submitBtn) {
                loginForm.addEventListener('submit', function(event) {
                    if (loginForm.checkValidity()) {
                        submitBtn.classList.add('loading');
                        submitBtn.disabled = true;
                    }
                });
            }
        });
    </script>
</body>
</html>
