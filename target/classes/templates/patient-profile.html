<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#patient-profile-content}, headerTitle='My Profile')}">
<body>
    <div id="patient-profile-content">
        <div class="card border-0 shadow-sm max-width-800 mx-auto" style="max-width: 800px;">
            <div class="d-flex align-items-center gap-2 border-bottom border-light pb-3 mb-4">
                <i class="bi bi-person-badge text-primary fs-4"></i>
                <h3 class="mb-0 fs-5 fw-bold" style="text-transform: none; color: var(--medical-dark);">Update Personal Details</h3>
            </div>
            
            <div th:if="${successMessage}" class="alert-custom alert-custom-success mb-4">
                <i class="bi bi-check-circle-fill fs-5"></i>
                <span th:text="${successMessage}">Success message</span>
            </div>

            <form th:action="@{/patient/profile/update}" method="POST" class="needs-validation" novalidate>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label fw-semibold text-muted small">First Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" id="firstName" name="firstName" th:value="${patient.firstName}" class="form-control" required autocomplete="given-name">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label fw-semibold text-muted small">Last Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" id="lastName" name="lastName" th:value="${patient.lastName}" class="form-control" required autocomplete="family-name">
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold text-muted small text-danger">Email Address (Login Username)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="email" id="email" th:value="${patient.email}" class="form-control bg-light text-muted" disabled>
                        </div>
                        <span class="text-danger small mt-1 d-block"><i class="bi bi-info-circle"></i> Email cannot be changed. Contact clinical staff if update is required.</span>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold text-muted small">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="text" id="phone" name="phone" th:value="${patient.phone}" class="form-control" required autocomplete="tel">
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="dob" class="form-label fw-semibold text-muted small">Date of Birth</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-calendar-event"></i></span>
                            <input type="date" id="dob" name="dob" th:value="${patient.dob}" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label fw-semibold text-muted small">Gender</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-gender-ambiguous"></i></span>
                            <select id="gender" name="gender" class="form-select" required>
                                <option value="Male" th:selected="${patient.gender == 'Male'}">Male</option>
                                <option value="Female" th:selected="${patient.gender == 'Female'}">Female</option>
                                <option value="Other" th:selected="${patient.gender == 'Other'}">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label fw-semibold text-muted small">Residential Address</label>
                    <textarea id="address" name="address" class="form-control" th:text="${patient.address}" rows="3" required style="resize: none;"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small text-primary">Medical History Summary</label>
                    <textarea class="form-control bg-light text-muted" th:text="${patient.medicalHistory}" rows="3" disabled style="resize: none;"></textarea>
                    <span class="text-primary small mt-1 d-block"><i class="bi bi-info-circle"></i> Medical history is read-only and can only be amended by physicians.</span>
                </div>

                <div class="d-flex gap-2 pt-3 border-top border-light">
                    <button type="submit" class="btn btn-primary px-4 py-2" style="border-radius: 8px;">Save Profile Changes</button>
                    <a th:href="@{/patient/dashboard}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 8px;">Back to Dashboard</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
