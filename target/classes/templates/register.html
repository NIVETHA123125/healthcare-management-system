<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient Account - CareGrid Healthcare</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    
    <style>
        /* Optional screen specific styling if needed */
    </style>
</head>
<body class="auth-container">
    <div class="auth-card auth-card-wide">
        <div class="auth-header">
            <a th:href="@{/}" class="auth-brand">
                <i class="bi-heart-pulse-fill"></i> CareGrid
            </a>
            <p class="auth-subtitle">Create Patient Account</p>
        </div>

        <form th:action="@{/register/save}" method="POST" class="needs-validation" id="registerForm" novalidate>
            <!-- Error Alert -->
            <div th:if="${error}" class="alert-custom alert-custom-danger">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${error}">Invalid credentials</span>
            </div>

            <!-- Name and Email Row -->
            <div class="row g-3">
                <div class="col-md-6 mb-1">
                    <label for="fullName" class="form-label-custom">Full Name</label>
                    <div class="input-group-custom">
                        <input type="text" id="fullName" name="fullName" class="form-control-custom" placeholder="e.g. Nivetha Vivek" required autocomplete="name">
                        <i class="bi bi-person input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6 mb-1">
                    <label for="email" class="form-label-custom">Email Address</label>
                    <div class="input-group-custom">
                        <input type="email" id="email" name="email" class="form-control-custom" placeholder="name@example.com" required autocomplete="email">
                        <i class="bi bi-envelope input-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Phone and DOB Row -->
            <div class="row g-3">
                <div class="col-md-6 mb-1">
                    <label for="phone" class="form-label-custom">Phone Number</label>
                    <div class="input-group-custom">
                        <input type="text" id="phone" name="phone" class="form-control-custom" placeholder="e.g. +91 9876543210" required autocomplete="tel">
                        <i class="bi bi-telephone input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6 mb-1">
                    <label for="dob" class="form-label-custom">Date of Birth</label>
                    <div class="input-group-custom">
                        <input type="date" id="dob" name="dob" class="form-control-custom" required>
                        <i class="bi bi-calendar-event input-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Gender Selector -->
            <div class="mb-3">
                <label for="gender" class="form-label-custom">Gender</label>
                <div class="input-group-custom">
                    <select id="gender" name="gender" class="form-control-custom form-select ps-5" required style="padding-left: 42px;">
                        <option value="" disabled selected>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <i class="bi bi-gender-ambiguous input-icon"></i>
                </div>
            </div>

            <!-- Residential Address -->
            <div class="mb-3">
                <label for="address" class="form-label-custom">Residential Address</label>
                <div class="input-group-custom">
                    <textarea id="address" name="address" class="form-control-custom" placeholder="Enter street address, city, state" rows="2" required style="padding-left: 42px; resize: none;"></textarea>
                    <i class="bi bi-geo-alt input-icon" style="top: 25px;"></i>
                </div>
            </div>

            <!-- Password Row -->
            <div class="row g-3">
                <div class="col-md-6 mb-2">
                    <label for="password" class="form-label-custom">Password</label>
                    <div class="input-group-custom">
                        <input type="password" id="password" name="password" class="form-control-custom" placeholder="••••••••" required autocomplete="new-password">
                        <i class="bi bi-lock input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6 mb-2">
                    <label for="confirmPassword" class="form-label-custom">Confirm Password</label>
                    <div class="input-group-custom">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control-custom" placeholder="••••••••" required autocomplete="new-password">
                        <i class="bi bi-shield-lock input-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit mt-2" id="submitBtn">
                <span>Register Patient Account</span>
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </button>
        </form>

        <!-- Sign In Link -->
        <div class="text-center mt-4 small text-muted">
            Already have an account? <a th:href="@{/login}" class="fw-semibold">Sign In</a>
        </div>
    </div>

        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Submit Spinner -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const submitBtn = document.getElementById('submitBtn');

            if (registerForm && submitBtn) {
                registerForm.addEventListener('submit', function(event) {
                    if (registerForm.checkValidity()) {
                        submitBtn.classList.add('loading');
                        submitBtn.disabled = true;
                    }
                });
            }
        });
    </script>
</body>
</html>
