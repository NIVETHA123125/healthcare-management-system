<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::#payments-content}, headerTitle='Invoices & Billing')}">
<body>
    <div id="payments-content">
        <!-- Action Bar Card -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-wallet2 text-primary fs-5"></i>
                    <h4 class="mb-0 fs-5 fw-bold" style="text-transform: none; color: var(--medical-dark);">Financial Operations Dashboard</h4>
                </div>
                <a th:href="@{/payments/add}" class="btn btn-primary d-inline-flex align-items-center gap-2 px-4" style="border-radius: 8px;">
                    <i class="bi bi-file-earmark-plus"></i> Create Billing Invoice
                </a>
            </div>
        </div>

        <!-- Table Card -->
        <div class="card border-0 shadow-sm p-0 overflow-hidden">
            <div class="px-4 py-3 border-bottom border-light bg-light d-flex align-items-center gap-2">
                <i class="bi bi-cash-stack text-primary"></i>
                <span class="text-uppercase fw-bold fs-7 text-muted tracking-wider">System Financial Records</span>
            </div>
            
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 100px;">Invoice ID</th>
                            <th>Date Issued</th>
                            <th>Patient Name</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th class="text-end" style="width: 220px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="payment : ${payments}">
                            <td class="fw-semibold text-primary" th:text="${payment.id}">1</td>
                            <td class="font-mono text-muted small" th:text="${#temporals.format(payment.paymentDate, 'yyyy-MM-dd hh:mm a')}">2026-06-25 10:00 AM</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="user-avatar-circle" style="width: 32px; height: 32px; font-size: 12px;" th:text="${#strings.substring(payment.patient.fullName, 0, 1)}">P</div>
                                    <span class="fw-bold" th:text="${payment.patient.fullName}">John Doe</span>
                                </div>
                            </td>
                            <td class="fw-bold text-dark" th:text="${'$' + #numbers.formatDecimal(payment.amount, 1, 2)}">$150.00</td>
                            <td>
                                <span class="badge bg-light text-dark border px-2 py-1 rounded" th:text="${payment.paymentMethod}">CARD</span>
                            </td>
                            <td>
                                <span class="status-pill" 
                                      th:classappend="${payment.status == 'PAID' ? 'status-pill-completed' : 'status-pill-cancelled'}" 
                                      th:text="${payment.status}">PAID</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{/payments/edit/{id}(id=${payment.id})}" class="btn btn-sm btn-outline-primary px-3 py-1" style="font-size: 12px; border-radius: 6px;">
                                        <i class="bi bi-pencil-square"></i> Edit / Settle
                                    </a>
                                    <a th:href="@{/payments/delete/{id}(id=${payment.id})}" 
                                       class="btn btn-sm btn-outline-danger px-3 py-1" 
                                       style="font-size: 12px; border-radius: 6px;"
                                       onclick="return confirm('Delete this invoice?');">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(payments)}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-credit-card fs-1 text-muted mb-3 d-block"></i>
                                <p class="text-muted mb-0">No billing statement logs found in system database.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
