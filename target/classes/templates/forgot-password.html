<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Credentials - CareGrid Healthcare</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    
    <style>
        /* Optional screen specific styling if needed */
    </style>
</head>
<body class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <a th:href="@{/}" class="auth-brand">
                <i class="bi-heart-pulse-fill"></i> CareGrid
            </a>
            <p class="auth-subtitle">Recover Password</p>
        </div>

        <form th:action="@{/forgot-password}" method="POST" class="needs-validation" id="recoverForm" novalidate>
            <!-- Error Alert -->
            <div th:if="${error}" class="alert-custom alert-custom-danger">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${error}">Invalid credentials</span>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label-custom">Account Email Address</label>
                <div class="input-group-custom">
                    <input type="email" id="email" name="email" class="form-control-custom" placeholder="name@example.com" required autocomplete="email">
                    <i class="bi bi-envelope input-icon"></i>
                </div>
            </div>

            <!-- Date of Birth -->
            <div class="mb-4">
                <label for="dob" class="form-label-custom">Date of Birth</label>
                <div class="input-group-custom">
                    <input type="date" id="dob" name="dob" class="form-control-custom" required>
                    <i class="bi bi-calendar-event input-icon"></i>
                </div>
            </div>

            <!-- OTP Section -->
            <div id="otpSection" class="mb-4 d-none">
                <label for="otp" class="form-label-custom">Enter OTP</label>
                <div class="input-group-custom">
                    <input type="text" id="otp" class="form-control-custom" placeholder="6-digit OTP">
                    <i class="bi bi-key input-icon"></i>
                </div>
                <div class="text-danger small mt-1" id="otpError"></div>
                <button type="button" class="btn btn-outline-success mt-2 w-100" id="btnVerifyOtp">Verify OTP</button>
            </div>

            <!-- Submit Button -->
            <button type="button" class="btn-submit" id="submitBtn">
                <span>Verify Security Info & Send OTP</span>
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </button>
            
            <!-- Actual Submit (Hidden) -->
            <button type="submit" class="d-none" id="realSubmitBtn"></button>
        </form>

        <!-- Sign In Link -->
        <div class="text-center mt-4 small text-muted">
            Remember credentials? <a th:href="@{/login}" class="fw-semibold">Sign In</a>
        </div>
    </div>


    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Submit Spinner -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const recoverForm = document.getElementById('recoverForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnVerifyOtp = document.getElementById('btnVerifyOtp');
            let otpSent = false;

            if (recoverForm && submitBtn) {
                submitBtn.addEventListener('click', function(event) {
                    if (recoverForm.checkValidity()) {
                        const email = document.getElementById('email').value.trim();
                        const dob = document.getElementById('dob').value.trim();
                        const errorAlert = document.querySelector('.alert-custom');
                        if (errorAlert) errorAlert.classList.add('d-none');
                        
                        submitBtn.classList.add('loading');
                        submitBtn.disabled = true;

                        fetch('/api/otp/send-for-recovery?email=' + encodeURIComponent(email) + '&dob=' + encodeURIComponent(dob), {
                            method: 'POST'
                        })
                        .then(res => res.json())
                        .then(data => {
                            submitBtn.classList.remove('loading');
                            submitBtn.disabled = false;
                            
                            if(data.success) {
                                document.getElementById('otpSection').classList.remove('d-none');
                                submitBtn.classList.add('d-none');
                                document.getElementById('email').readOnly = true;
                                document.getElementById('dob').readOnly = true;
                            } else {
                                alert(data.message || 'Failed to send OTP.');
                            }
                        })
                        .catch(err => {
                            submitBtn.classList.remove('loading');
                            submitBtn.disabled = false;
                            alert('Error occurred. Try again.');
                        });
                    } else {
                        recoverForm.reportValidity();
                    }
                });
                
                btnVerifyOtp.addEventListener('click', function() {
                    const email = document.getElementById('email').value.trim();
                    const otp = document.getElementById('otp').value.trim();
                    
                    if(!otp) {
                        document.getElementById('otpError').textContent = 'Please enter OTP.';
                        return;
                    }
                    document.getElementById('otpError').textContent = '';
                    
                    const btn = this;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Verifying...';
                    btn.disabled = true;

                    fetch('/api/otp/verify?email=' + encodeURIComponent(email) + '&otp=' + encodeURIComponent(otp), {
                        method: 'POST'
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            // OTP Verified, submit form
                            document.getElementById('realSubmitBtn').click();
                        } else {
                            document.getElementById('otpError').textContent = data.message || 'Invalid OTP.';
                            btn.innerHTML = 'Verify OTP';
                            btn.disabled = false;
                        }
                    })
                    .catch(err => {
                        document.getElementById('otpError').textContent = 'Error occurred. Try again.';
                        btn.innerHTML = 'Verify OTP';
                        btn.disabled = false;
                    });
                });
            }
        });
    </script>
</body>
</html>
